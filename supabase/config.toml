# Supabase CLI configuration.
# `project_id` is a local identifier; link to a real project with:
#   supabase link --project-ref <your-project-ref>
project_id = "anwesenheit"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[db.migrations]
# Files in supabase/migrations are applied in filename order.
schema_paths = []

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "50MiB"

[storage.buckets.photos]
public = true

[auth]
enabled = true
# Set this to your deployed app URL in production.
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
enable_signup = false

[auth.email]
enable_signup = false
enable_confirmations = false

# Owner-only user management runs server-side with the service role.
[functions.admin-create-user]
verify_jwt = true

[functions.admin-delete-user]
verify_jwt = true
