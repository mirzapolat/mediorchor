<!doctype html>
<!--
  Shown by the service worker (public/sw.js) when a page is opened without a
  connection and not even the app itself is cached yet, and by index.html when
  the app's files fail to load. Self-contained: no app code, nothing that
  needs the network. The colours mirror the theme tokens in src/index.css and
  the drawing the one in src/components/LoadError.tsx.
-->
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Offline</title>
    <script>
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('anwesenheit.theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
      })();
    </script>
    <!-- Branding (name, accent, language); cached by the service worker. -->
    <script src="/config.js"></script>
    <style>
      :root {
        color-scheme: light;
        --bg: #fafafa;
        --surface: #ffffff;
        --border: #e5e5e5;
        --border-strong: #d4d4d4;
        --text: #1a1a1a;
        --text-secondary: #6b6b6b;
        --text-tertiary: #9a9a9a;
        --black: #1a1a1a;
        --black-hover: #333333;
        --white: #ffffff;
        --accent: #efa100;
      }
      :root[data-theme='dark'] {
        color-scheme: dark;
        --bg: #0c0c0d;
        --surface: #18181b;
        --border: #2e2e33;
        --border-strong: #46464d;
        --text: #ececee;
        --text-secondary: #a1a1aa;
        --text-tertiary: #71717a;
        --black: #ececee;
        --black-hover: #d4d4d8;
        --white: #18181b;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 64px 16px;
        background: var(--bg);
        color: var(--text);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
      }
      main { max-width: 384px; animation: in 500ms ease-out; }
      .art { position: relative; width: 240px; height: 160px; margin: 0 auto; }
      .art svg { width: 100%; height: 100%; }
      .badge {
        position: absolute;
        top: 4px;
        left: 50%;
        display: flex;
        width: 44px;
        height: 44px;
        align-items: center;
        justify-content: center;
        transform: translateX(-50%);
        border: 1px solid var(--border);
        border-radius: 9999px;
        background: var(--surface);
        color: var(--text-secondary);
        box-shadow: 0 1px 2px rgb(0 0 0 / 0.05);
      }
      .glow { fill: var(--accent); opacity: 0.1; }
      .staff { stroke: var(--border-strong); }
      .notes { fill: var(--text-secondary); stroke: var(--text-secondary); }
      .float {
        fill: var(--accent);
        stroke: var(--accent);
        transform-box: fill-box;
        transform-origin: center;
        animation: float 3.2s ease-in-out infinite;
      }
      h1 { margin: 24px 0 0; font-size: 20px; line-height: 28px; font-weight: 600; letter-spacing: -0.01em; }
      p { margin: 6px 0 0; font-size: 14px; line-height: 20px; color: var(--text-secondary); }
      button {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        margin-top: 24px;
        min-height: 40px;
        padding: 8px 16px;
        border: 0;
        border-radius: 6px;
        background: var(--black);
        color: var(--white);
        font: inherit;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
      }
      button:hover { background: var(--black-hover); }
      .waiting {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        margin-top: 12px;
        font-size: 12px;
        color: var(--text-tertiary);
      }
      .dot { width: 6px; height: 6px; border-radius: 9999px; background: var(--text-tertiary); animation: pulse 2s ease-in-out infinite; }
      @keyframes in { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
      @keyframes float {
        0%, 100% { transform: translate(0, 0) rotate(0); }
        50% { transform: translate(3px, -8px) rotate(-6deg); }
      }
      @keyframes pulse { 50% { opacity: 0.4; } }
      @media (prefers-reduced-motion: reduce) {
        main, .float, .dot { animation: none; }
      }
    </style>
  </head>
  <body>
    <main role="alert">
      <div class="art" aria-hidden="true">
        <svg viewBox="0 0 240 160" fill="none" stroke-linecap="round">
          <circle class="glow" cx="120" cy="88" r="70" />
          <g class="staff" stroke-width="2">
            <path d="M28 64H100M28 74H100M28 84H100M28 94H100M28 104H100" />
          </g>
          <g class="staff" stroke-width="2" transform="rotate(8 140 84)">
            <path d="M140 64H212M140 74H212M140 84H212M140 94H212M140 104H212" />
          </g>
          <g class="notes" stroke-width="2.5">
            <ellipse cx="58" cy="99" rx="7" ry="5" transform="rotate(-20 58 99)" stroke="none" />
            <path d="M64.5 97V62" />
            <ellipse cx="80" cy="89" rx="7" ry="5" transform="rotate(-20 80 89)" stroke="none" />
            <path d="M86.5 87V52" />
            <path d="M64.5 62L86.5 52" stroke-width="5" />
          </g>
          <g class="notes" stroke-width="2.5" transform="rotate(8 140 84)">
            <ellipse cx="172" cy="79" rx="7" ry="5" transform="rotate(-20 172 79)" stroke="none" />
            <path d="M178.5 77V44" />
            <path d="M178.5 44C184 50 192 52 190 64" />
          </g>
          <g class="float" stroke-width="2.5">
            <ellipse cx="116" cy="132" rx="6" ry="4.5" transform="rotate(-20 116 132)" stroke="none" />
            <path d="M121.5 130V108" />
          </g>
        </svg>
        <div class="badge">
          <!-- lucide "wifi-off" -->
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 20h.01" /><path d="M8.5 16.429a5 5 0 0 1 7 0" /><path d="M5 12.859a10 10 0 0 1 5.17-2.69" />
            <path d="M19 12.859a10 10 0 0 0-2.007-1.523" /><path d="M2 8.82a15 15 0 0 1 4.177-2.643" />
            <path d="M22 8.82a15 15 0 0 0-11.288-3.764" /><path d="m2 2 20 20" />
          </svg>
        </div>
      </div>
      <h1 id="title">Keine Verbindung</h1>
      <p id="text">Du bist offline. Sobald die Verbindung zurück ist, geht es hier weiter.</p>
      <button id="retry" type="button">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8" /><path d="M21 3v5h-5" />
        </svg>
        <span id="retry-label">Erneut versuchen</span>
      </button>
      <div class="waiting" id="waiting"><span class="dot"></span><span id="waiting-label">Warte auf Verbindung…</span></div>
    </main>
    <script>
      (function () {
        // Same texts as loadError* in src/locales/{de,en,fi}.ts.
        var TEXTS = {
          de: {
            offlineTitle: 'Keine Verbindung',
            offlineText: 'Du bist offline. Sobald die Verbindung zurück ist, geht es hier weiter.',
            title: 'Da ist etwas schiefgelaufen',
            text: 'Die Seite konnte nicht geladen werden. Versuch es gleich noch einmal.',
            retry: 'Erneut versuchen',
            waiting: 'Warte auf Verbindung…',
          },
          en: {
            offlineTitle: 'No connection',
            offlineText: 'You seem to be offline. As soon as you’re back online, it continues here.',
            title: 'Something went wrong',
            text: 'This page couldn’t be loaded. Please try again in a moment.',
            retry: 'Try again',
            waiting: 'Waiting for connection…',
          },
          fi: {
            offlineTitle: 'Ei yhteyttä',
            offlineText: 'Olet offline-tilassa. Kun yhteys palaa, jatketaan tästä.',
            title: 'Jokin meni pieleen',
            text: 'Sivua ei voitu ladata. Yritä hetken kuluttua uudelleen.',
            retry: 'Yritä uudelleen',
            waiting: 'Odotetaan yhteyttä…',
          },
        };
        var config = window.__APP_CONFIG__ || {};
        var lang = null;
        try { lang = localStorage.getItem('anwesenheit.lang'); } catch (e) {}
        if (!TEXTS[lang]) lang = String(config.VITE_DEFAULT_LANGUAGE || '').trim().toLowerCase();
        if (!TEXTS[lang]) lang = 'de';
        var t = TEXTS[lang];
        document.documentElement.lang = lang;
        if (config.VITE_APP_NAME && config.VITE_APP_NAME.indexOf('__') !== 0) document.title = config.VITE_APP_NAME;
        if (/^#[0-9a-f]{6}$/i.test(config.VITE_ACCENT_COLOR || '')) {
          document.documentElement.style.setProperty('--accent', config.VITE_ACCENT_COLOR);
        }

        // index.html sends the page it could not start here as ?from=…; the
        // service worker shows this page in place of the one asked for.
        // Only pages of this app (resolved, so "/\t/evil.example" can't slip by).
        var from = new URLSearchParams(location.search).get('from');
        var target = null;
        try {
          var url = from ? new URL(from, location.origin) : null;
          if (url && url.origin === location.origin && url.pathname !== '/offline.html') {
            target = url.pathname + url.search + url.hash;
          }
        } catch (e) {}
        var retry = function () {
          if (target) location.replace(target);
          else location.reload();
        };

        var render = function () {
          var offline = !navigator.onLine;
          document.getElementById('title').textContent = offline ? t.offlineTitle : t.title;
          document.getElementById('text').textContent = offline ? t.offlineText : t.text;
          document.getElementById('waiting').style.display = offline ? '' : 'none';
        };
        document.getElementById('retry-label').textContent = t.retry;
        document.getElementById('waiting-label').textContent = t.waiting;
        document.getElementById('retry').addEventListener('click', retry);
        window.addEventListener('offline', render);
        window.addEventListener('online', retry);
        render();
      })();
    </script>
  </body>
</html>
