<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link id="favicon" rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fafafa" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0c0c0d" media="(prefers-color-scheme: dark)" />
    <!-- Installable app (PWA); name filled in by the server from branding. -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="application-name" content="Anwesenheit" />
    <meta name="apple-mobile-web-app-title" content="Anwesenheit" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- Apply the stored theme before first paint (no light flash in dark
         mode). Same key and rules as src/lib/theme.tsx. -->
    <script>
      (function () {
        var pref = 'system';
        try { pref = localStorage.getItem('anwesenheit.theme') || 'system'; } catch (e) {}
        var dark = pref === 'dark' || (pref !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
      })();
    </script>
    <title>Anwesenheit</title>
    <!-- Runtime config; overwritten at container start for Docker deploys. -->
    <script src="/config.js"></script>
    <!-- Usage analytics (self-hosted Umami, cookieless). Pageviews are sent
         by src/lib/analytics.ts with ids and tokens stripped from the path;
         data-domains keeps local development out of the stats. async, not
         defer: a slow analytics host must not hold back the app start. -->
    <script
      id="umami-script"
      async
      src="https://umami.mirzapolat.com/script.js"
      data-website-id="ca24ca25-d942-4c0b-a4a9-42d65bcbab89"
      data-domains="app.medizinerorchester.de"
      data-auto-track="false"
      data-before-send="umamiBeforeSend"
    ></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
